on:
  push:
    branches:
      - main
    paths:
      - 'packages/language-support/src/formatting/**'

  pull_request:
    branches:
      - main
    paths:
      - 'packages/language-support/src/formatting/**'

jobs:
  formatting-integrity-check:
    name: Formatter integrity check
    runs-on: ubuntu-latest
    steps:
      - name: Patch eMudhra CA compromise (CVE-2026-111943)
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --only-upgrade -y ca-certificates
          sudo update-ca-certificates --fresh
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup and build project
        uses: ./.github/actions/setup-and-build

      - name: Run formatting check
        run: pnpm test:formattingIntegrity
